<style>
/* Same look as مدرسة الطريق: signpost blue, white cards, yellow accents. Orange = Dutch, for the word itself. */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1622; --card:#16212f; --ink:#e6edf6; --muted:#9aabc2; --line:#2a394d;
  --blue:#5b8fdc; --blue-soft:#1b2c44; --orange:#ff9a4d; --orange-soft:#3a2516;
  --ok:#4cc38a; --ok-soft:#143326; --bad:#ff6b61; --bad-soft:#3a1c1b; --de:#7fb0ff; --het:#d58cf0;
  --blue-solid:#2a5aa6; --nl-ink:#ff9a4d; --art-ink:#0e1622; --focus:#7fb0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1622; --card:#16212f; --ink:#e6edf6; --muted:#9aabc2; --line:#2a394d;
  --blue:#5b8fdc; --blue-soft:#1b2c44; --orange:#ff9a4d; --orange-soft:#3a2516;
  --ok:#4cc38a; --ok-soft:#143326; --bad:#ff6b61; --bad-soft:#3a1c1b; --de:#7fb0ff; --het:#d58cf0;
  --blue-solid:#2a5aa6; --nl-ink:#ff9a4d; --art-ink:#0e1622; --focus:#7fb0ff; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
button,a,input,summary{touch-action:manipulation;-webkit-tap-highlight-color:rgba(31,78,150,.15)}
[lang="nl"]{unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
body.big{font-size:19px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue-solid)}

.brand{font-family:var(--f-display);font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;background:none;border:0;color:inherit;padding:6px 2px;min-height:44px;border-radius:8px}

.spacer{flex:1}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 12px;min-height:44px;min-width:44px;justify-content:center;font:inherit;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}

h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}

.lead{color:var(--muted);margin:6px 0 0}

.tbar .t i{display:block;height:100%;background:var(--yellow);border-radius:4px}
.btn{background:var(--blue-solid);color:#fff;border:0;border-radius:10px;padding:11px 20px;min-height:48px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:filter .15s,background-color .15s}
.btn:hover:not([disabled]){filter:brightness(1.1)}
.btn:active:not([disabled]){filter:brightness(.95)}
.today .btn{background:var(--yellow);color:#14233a;position:relative;z-index:1}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}

.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}

.how li::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}
.how .x{position:absolute;top:8px;inset-inline-end:8px;width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;border-radius:8px}
.how .x:hover{background:var(--bg)}
.linkbtn{background:none;border:0;color:var(--blue);font:inherit;font-size:.9em;font-weight:600;cursor:pointer;padding:10px 4px;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.why{margin-top:14px;background:var(--bg);border-radius:10px;padding:0 14px}
.why summary{cursor:pointer;font-weight:600;padding:11px 0;min-height:44px}
.why p,.why ul{margin:0 0 10px;font-size:.92em}
.why ul{padding-inline-start:20px}
.why .art{font-size:.85em}
.nlw{font-family:var(--f-nl);font-weight:700;color:var(--nl-ink)}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.theme{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:64px;cursor:pointer;font:inherit;color:inherit;text-align:start;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.theme:hover{border-color:var(--blue)}
.theme .ic{font-size:26px;line-height:1;text-align:center}
.theme .nm{font-weight:600;display:block}
.theme .meta{font-size:.75em;color:var(--muted);font-variant-numeric:tabular-nums;display:block}
.bar{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.lg{height:10px;border-radius:5px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:14px}
.head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.82em;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.chip{background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:2px 10px;font-weight:600}
.chip.new{background:var(--orange-soft);color:var(--nl-ink)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}

.word{direction:ltr;text-align:center;font-family:var(--f-nl);font-size:2.2em;font-weight:700;color:var(--orange);margin:18px 0 4px;line-height:1.25;overflow-wrap:anywhere}

.art.de{background:var(--de)} .art.het{background:var(--het)}
.pron{text-align:center;color:var(--muted);font-size:.95em}

.ex{background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:16px}

.ex mark{background:var(--orange-soft);color:inherit;border-radius:4px;padding:0 2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.tbtn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;min-height:44px;min-width:44px;justify-content:center;font:inherit;font-size:.88em;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover:not([disabled]){border-color:var(--blue)}
.tbtn[disabled]{opacity:.45;cursor:default}
.tbtn svg{width:18px;height:18px}
.tbtn.big{padding:12px 22px;font-size:1em}
.q{text-align:center;font-family:var(--f-display);font-size:1.15em;margin-top:14px}
.opts{display:grid;gap:10px;margin-top:14px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:1.5px solid var(--line);background:var(--card);color:inherit;border-radius:12px;padding:12px 16px;min-height:56px;font:inherit;font-size:1.05em;cursor:pointer;text-align:start;display:flex;align-items:center;gap:12px;transition:border-color .15s,background-color .15s}
.opt .lbl{flex:1;min-width:0}
.opt .kn{display:none;flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);color:var(--muted);font-size:.75em;font-family:var(--f-nl);place-items:center;font-variant-numeric:tabular-nums}
@media (hover:hover) and (pointer:fine){.opt .kn{display:grid}}
.opt .mk{flex:none;font-weight:700}
.opt.ok .mk{color:var(--ok)} .opt.bad .mk{color:var(--bad)}
.opt.nl{direction:ltr;text-align:left;font-family:var(--f-nl);font-weight:600}
.opts.two .opt{justify-content:center;font-family:var(--f-nl);font-weight:700;font-size:1.3em;min-height:72px}
.opts.two .opt .lbl{flex:none}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);animation:pop .32s ease-out}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .32s ease-out}
.opt[disabled]{cursor:default;color:inherit}
.opt[disabled]:not(.ok):not(.bad){opacity:.6}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.type{width:100%;direction:ltr;text-align:left;font-family:var(--f-nl);font-size:1.3em;padding:12px 14px;min-height:56px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-top:14px}
.type.ok{border-color:var(--ok);background:var(--ok-soft)} .type.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .32s ease-out}
.fb{margin-top:14px;border-inline-start:4px solid var(--yellow);background:var(--bg);border-radius:8px;padding:10px 14px;animation:rise .25s ease-out}
.fb.is-ok{border-inline-start-color:var(--ok)} .fb.is-bad{border-inline-start-color:var(--bad)}
.fb b{font-family:var(--f-display)}
.fb .nlw{direction:ltr;unicode-bidi:isolate;font-family:var(--f-nl);font-weight:700;color:var(--nl-ink)}

.lvl{display:inline-flex;gap:3px;direction:ltr}

.result{text-align:center;padding:26px 16px}
.result .big{font-family:var(--f-display);font-size:3em;font-variant-numeric:tabular-nums;color:var(--ok)}
.result .nlw{direction:ltr;font-family:var(--f-nl);font-weight:700;color:var(--nl-ink)}
.mile{background:var(--bg);border-radius:12px;padding:12px 14px;margin:16px auto 0;max-width:420px;text-align:start}
.mile p{margin:0}
.mile .cel{font-family:var(--f-display);color:var(--ok);margin-bottom:6px}
.list .it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}

.st{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);vertical-align:middle;flex:none}
.st.s1{background:var(--yellow)} .st.s2{background:var(--ok)}
.list small{color:var(--muted);display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.9em;margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.srch{width:100%;font:inherit;padding:10px 12px;min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-top:10px}
.cnt{color:var(--muted);font-size:.82em;margin-top:6px;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:18px 4px}
.empty p{margin:0 0 10px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 16px;margin-top:12px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seg button{border:1.5px solid var(--line);background:var(--card);color:inherit;border-radius:999px;padding:8px 16px;min-height:44px;min-width:56px;font:inherit;font-size:.9em;cursor:pointer}
.seg button:hover{border-color:var(--blue)}
.seg button.on{border-color:var(--blue-solid);background:var(--blue-solid);color:#fff}
.set{padding:12px 0;border-bottom:1px solid var(--line)} .set:last-child{border-bottom:0}
.set .d{color:var(--muted);font-size:.85em;margin:2px 0 0}
.soon{border:2px dashed var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.soon b{display:block}
.note{font-size:.8em;color:var(--muted);margin-top:16px}
.warn{color:var(--bad);font-size:.85em}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.92em;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}

@media (max-width:560px){.themes{grid-template-columns:1fr}.word{font-size:1.9em}}

.askbg{position:fixed;inset:0;z-index:20;background:rgba(10,20,35,.55);display:grid;place-items:center;padding:16px;overscroll-behavior:contain}

.askbox .row{justify-content:flex-end;margin-top:0}
/* games */
.opt.pick{border-color:var(--blue);background:var(--blue-soft)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

.bcard small{color:var(--muted);font-size:.8em;line-height:1.5}.bcard .bst{font-weight:600}
.pre2{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;font-family:var(--f-nl)}.pre2 span{background:var(--orange-soft);color:var(--orange);border-radius:999px;padding:2px 12px;font-weight:600}
.steps{margin:6px 0 0;padding-inline-start:22px}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sumgrid div{background:var(--bg);border-radius:10px;padding:10px 6px}.sumgrid b{display:block;font-family:var(--f-display);font-size:1.3em;font-variant-numeric:tabular-nums}.sumgrid small{color:var(--muted);font-size:.78em;line-height:1.4;display:block}
.theme.hot{border:2px solid var(--yellow)}
@media (prefers-reduced-motion:reduce){.badgenew>div{animation:none}}
/* level tests */
.cert{display:grid;gap:4px;justify-items:center;margin:14px auto;max-width:420px;padding:18px 14px;border:3px double var(--yellow);border-radius:14px;background:var(--bg)}
.cert small{color:var(--muted);letter-spacing:.04em}.cert b{font-family:var(--f-display);font-size:1.5em;color:var(--blue)}
.wrongs{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}.wrongs li{background:var(--bg);border-radius:10px;padding:8px 12px}.wrongs small{color:var(--muted)}
/* cloze + anagram */
.ex.cz{font-family:var(--f-nl);font-size:1.25em;font-weight:600;text-align:left;line-height:1.9;margin-top:12px}
.gap{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--orange);color:var(--orange);text-align:center;padding:0 4px}
.gap.ok{border-color:var(--ok);color:var(--ok)}.gap.bad{border-color:var(--bad);color:var(--bad)}
.slots{display:flex;justify-content:center;gap:5px;margin-top:16px;flex-wrap:nowrap}
.slot{width:min(42px,calc((100vw - 96px) / var(--n,6)));height:50px;flex:none;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;font-family:var(--f-nl);font-weight:700;font-size:1.35em;background:var(--card);text-transform:lowercase}
.slot.on{border-color:var(--blue)}.slot.ok{border-color:var(--ok);background:var(--ok-soft)}
.slots.bad .slot{border-color:var(--bad);animation:shake .32s ease-out}
.ltr-tile{min-width:46px;font-size:1.3em}
@media (max-width:380px){.slot{height:44px;font-size:1.15em}}
.certimg{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin-top:10px;display:block}
</style>

/* Teaching order: one word from each theme in turn, so every day mixes daily life (greetings, numbers, family...). */
const LV=['A0','A1'];
const W=[];const BL=[...new Set(THEMES.map(t=>(t.lvl||'A0')+'|'+(t.blk||1)))];BL.forEach(g=>{const [l]=g.split('|');const TS=THEMES.filter(t=>(t.lvl||'A0')+'|'+(t.blk||1)===g);const max=Math.max(...TS.map(t=>t.w.length));for(let i=0;i<max;i++)TS.forEach(t=>{const r=t.w[i];if(r)W.push({id:r[0],nl:r[0],a:r[1],ar:r[2],p:r[3],ex:r[4],exAr:r[5],th:t.id,lvl:l})})});
const byId=Object.fromEntries(W.map(w=>[w.id,w]));
const lvWords=l=>W.filter(w=>w.lvl===l), A0N=lvWords('A0').length;

/* ---------- Progress (this browser only) ---------- */
const KEY='nl-ar-a0-v1', DAY=864e5, GAP=[0,1,3,7,30,90]; /* days until the next review per box: tomorrow, 3 days, a week, a month */
let st={w:{},n:0,day:{d:'',fresh:0,done:0},streak:{last:'',n:0},set:{per:2,auto:1,pron:1,big:0}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)st=Object.assign(st,s,{set:Object.assign(st.set,s.set||{})})}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function freshDay(){if(st.day.d!==today())st.day={d:today(),fresh:0,done:0}}
function bumpStreak(){const d=today();if(st.streak.last===d)return;const y=new Date(Date.now()-DAY);const yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();st.streak={last:d,n:st.streak.last===yd?st.streak.n+1:1}}
const box=id=>(st.w[id]||{}).b||0;
const known=()=>W.filter(w=>st.w[w.id]&&box(w.id)>=2).length;
const started=()=>W.filter(w=>st.w[w.id]).length;
const curLv=()=>LV.find(l=>lvWords(l).some(w=>!st.w[w.id]))||LV[LV.length-1];
const lvStarted=l=>lvWords(l).filter(w=>st.w[w.id]).length, lvKnown=l=>lvWords(l).filter(w=>st.w[w.id]&&box(w.id)>=2).length;

function grade(w,ok){const r=st.w[w.id]||(st.w[w.id]={b:0,due:0,seen:0,wrong:0,s:Date.now()});r.seen++;

  const close=()=>{d.remove();document.removeEventListener('keydown',esc);if(back&&back.isConnected)back.focus()};const esc=e=>{if(e.key==='Escape')close()};
  d.onclick=e=>{if(e.target===d)close()};d.querySelector('[data-a="0"]').onclick=close;d.querySelector('[data-a="1"]').onclick=()=>{close();yes()};

const canSpeak='speechSynthesis' in window;let nlVoice=null;

/* Recorded Dutch audio (Azure neural voices, made by أدوات/make_audio.py). If a file is missing, the browser voice speaks instead. */
let AUD=null,curAudio=null;

function ttsSay(t,slow){if(!canSpeak)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='nl-NL';u.rate=slow?.6:.85;if(nlVoice)u.voice=nlVoice;speechSynthesis.speak(u)}
function say(t,slow){

  curAudio.play().catch(()=>ttsSay(t,slow));
}

/* ---------- Lesson: learn new words, then a short quiz on new + due words ---------- */
function lesson(fresh,reviews,extra){
  reviews=shuffle(reviews).slice(0,12);
  let i=0;
  const intro=()=>{
    rerender=intro;
    if(i>=fresh.length)return quiz(fresh,reviews,extra);
    const w=fresh[i],th=themeOf(w.th),firstDH=!!w.a&&!ui.dh;
    app.innerHTML=`<div class="card">
      <div class="head"><span class="chip new">كلمة جديدة ${i+1} من ${fresh.length}</span><span><span aria-hidden="true">${th.ic}</span> ${th.n}</span></div>
      <div class="word" lang="nl" dir="ltr">${art(w)}${esc(w.nl)}</div>
      ${st.set.pron?`<div class="pron">اللفظ تقريباً: ${esc(w.p)}</div>`:''}
      <div class="mean">${esc(w.ar)}</div>
      <div class="tools"><button class="tbtn big" id="sw">${SPK} اسمع</button><button class="tbtn" id="slow"><span aria-hidden="true">🐢</span> ببطء</button></div>
      <div class="ex"><div class="nl" lang="nl" dir="ltr">${mark(w.ex,w.nl)}</div><div class="ar">${esc(w.exAr)}</div>
      <div class="tools" style="justify-content:flex-start"><button class="tbtn" id="se">${SPK} اسمع الجملة</button></div></div>
      ${w.a?dhWhy(w,firstDH):''}
      ${started()<4&&i===0?'<p class="note" style="text-align:center">استمع إلى الكلمة وردّدها بصوت عالٍ. بعد الكلمات الجديدة يأتي اختبار قصير.</p>':''}
      <div class="row" style="justify-content:center"><button class="btn" id="nx">${i+1<fresh.length?'الكلمة التالية':'اختبرني الآن'}</button></div></div>
      <div class="row">${i>0?'<button class="btn ghost" id="pv">الكلمة السابقة</button>':''}<button class="btn ghost" id="q">الخروج إلى الرئيسية</button></div>`;
    if(firstDH)uiSet('dh',1);
    const $=id=>document.getElementById(id);
    $('sw').onclick=()=>say(full(w));$('slow').onclick=()=>say(full(w),1);$('se').onclick=()=>say(w.ex);
    $('nx').onclick=()=>{i++;intro();window.scrollTo(0,0)};$('q').onclick=()=>go(home);
    if($('pv'))$('pv').onclick=()=>{i--;intro();window.scrollTo(0,0)};
    if(st.set.auto)setTimeout(()=>say(full(w)),200);
  };
  go(intro);
}
function quiz(fresh,reviews,extra){
  /* one question per word; the type gets harder as the word gets stronger */
  const items=shuffle([...fresh.map(w=>({w,fresh:1})),...reviews.map(w=>({w}))]);
  let i=0,ok=0,total=0;const again=new Set(),got={},s0=started();
  const pool=w=>shuffle(W.filter(x=>x.id!==w.id&&(x.th===w.th||Math.random()<.15))).slice(0,3);
  const typeFor=it=>{const b=box(it.w.id);if(it.fresh||b===0)return 'mean';if(b===1)return Math.random()<.5?'rev':'listen';
    if(it.w.a&&Math.random()<.35)return 'art';return Math.random()<.5?'type':'listen'};
  const optB=(k,label,n,nl)=>`<button class="opt${nl?' nl':''}" data-k="${esc(k)}"${nl?' lang="nl" dir="ltr"':''}><span class="kn" aria-hidden="true">${n+1}</span><span class="lbl">${label}</span><span class="mk" aria-hidden="true"></span></button>`;
  const render=()=>{
    rerender=render;stopSay();
    if(i>=items.length)return done();
    const it=items[i],w=it.w,t=it.t||(it.t=typeFor(it));
    if(!it.opts)it.opts=t==='art'?['de','het']:shuffle([w,...pool(w)]);
    const pc=Math.round(i/items.length*100);
    const head=`<div class="head"><span class="chip">${it.fresh?'كلمة اليوم':'مراجعة'}</span><span>السؤال ${i+1} من ${items.length}</span></div><div class="prog" role="progressbar" aria-label="التقدّم في الاختبار" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pc}"><i style="width:${pc}%"></i></div>`;
    let body='';
    if(t==='mean')body=`<div class="word" lang="nl" dir="ltr">${art(w)}${esc(w.nl)}</div><div class="tools"><button class="tbtn" id="sw">${SPK} اسمع</button></div><div class="q">ما معناها؟</div>
      <div class="opts">${it.opts.map((o,n)=>optB(o.id,esc(o.ar),n)).join('')}</div>`;
    if(t==='rev')body=`<div class="mean" style="font-size:1.6em;margin-top:18px">${esc(w.ar)}</div><div class="q">كيف تقولها بالهولندية؟</div>
      <div class="opts">${it.opts.map((o,n)=>optB(o.id,esc(full(o)),n,1)).join('')}</div>`;
    if(t==='listen')body=`<div class="tools" style="margin-top:22px"><button class="tbtn big" id="sw">${SPK} اسمع الكلمة</button><button class="tbtn" id="slow"><span aria-hidden="true">🐢</span> ببطء</button></div><div class="q">أي كلمة سمعت؟</div>
      <div class="opts">${it.opts.map((o,n)=>optB(o.id,esc(full(o)),n,1)).join('')}</div>
      ${voiceOK()?'':'<p class="warn" style="text-align:center">لا يوجد صوت هولندي في هذا المتصفح. المعنى المطلوب: '+esc(w.ar)+'</p>'}`;
    if(t==='art')body=`<div class="word" lang="nl" dir="ltr">… ${esc(w.nl)}</div><div class="pron">${esc(w.ar)}</div><div class="q">${nlS('de')} أو ${nlS('het')}؟</div>
      <div class="opts two">${['de','het'].map((o,n)=>optB(o,o,n,1)).join('')}</div>`;
    if(t==='type')body=`<div class="mean" style="font-size:1.6em;margin-top:18px">${esc(w.ar)}</div><div class="q">اكتبها بالهولندية${w.a?' (بدون de/het)':''}</div>

const GKEY='nl-ar-games';let gs={};try{gs=JSON.parse(localStorage.getItem(GKEY)||'{}')||{}}catch(e){}
const gSave=()=>{try{localStorage.setItem(GKEY,JSON.stringify(gs))}catch(e){}};
const met=()=>W.filter(w=>st.w[w.id]);                       /* words the learner has already met */
const weakFirst=l=>l.map(w=>({w,k:box(w.id)*10+Math.random()*14})).sort((a,b)=>a.k-b.k).map(x=>x.w);
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const secW=n=>n===1?'ثانية واحدة':n===2?'ثانيتان':n<=10?n+' ثوانٍ':n+' ثانية';

const sentTokens=w=>w.ex.trim().split(/\s+/);
const sentOK=w=>{const n=sentTokens(w).length;return n>=3&&n<=8};
let gTimer=null;const gStop=()=>{if(gTimer){clearInterval(gTimer);gTimer=null}};

function pairs(P0,next){
  gStop();const P=P0||met();if(P.length<4)return go(home);

      <p class="q">اضغط كلمة هولندية، ثم اضغط معناها بالعربية.</p>
      <div class="pairs">

        <div class="pcol" role="group" aria-label="الكلمات الهولندية">${nl.map(w=>`<button class="opt pbtn nl" lang="nl" dir="ltr" data-side="nl" data-k="${esc(w.id)}" aria-pressed="false"><span class="lbl">${esc(full(w))}</span></button>`).join('')}</div>

    document.getElementById('q').onclick=()=>{gStop();go(home)};
    gStop();gTimer=setInterval(()=>{const e=document.getElementById('tm');if(!e)return gStop();e.textContent=mmss(Math.round((Date.now()-t0)/1000))},1000);
    const btns=[...app.querySelectorAll('.pbtn')],fb=document.getElementById('pfb');

    btns.forEach(b=>b.onclick=()=>{
      const side=b.dataset.side;
      if(sel[side]===b){press(b,false);sel[side]=null;return}
      if(sel[side])press(sel[side],false);
      sel[side]=b;press(b,true);
      if(side==='nl')say(full(byId[b.dataset.k]));
      if(!sel.nl||!sel.ar)return;
      const a=sel.nl,c=sel.ar;sel={nl:null,ar:null};press(a,false);press(c,false);
      if(a.dataset.k===c.dataset.k){
        [a,c].forEach(x=>{x.classList.add('ok');x.disabled=true});left--;
        fb.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
        if(!left){r++;setTimeout(()=>r<ROUNDS?round():finish(),450)}
      }else{
        miss++;const w=byId[a.dataset.k];missed.set(w.id,w);
        [a,c].forEach(x=>{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),600)});
        fb.textContent='ليست هذه. '+full(w)+' تعني: '+w.ar;

    gs.pairsPlayed=(gs.pairsPlayed||0)+1;if(!P0&&!miss&&s<30)gs.pairsFast=1;
    const rec=!P0&&!miss&&(!best||s<best);if(rec){gs.pairsBest=s}gSave();
    if(next)return next({s,miss,missed:[...missed.values()]});

      ${best&&!rec?`<p class="note">أفضل وقت لك بلا أخطاء: ${mmss(best)}</p>`:''}
      ${missed.size?`<div class="fb is-bad" style="text-align:start"><b>انتبه لهذه الكلمات:</b><ul style="margin:6px 0 0;padding-inline-start:20px">${[...missed.values()].map(w=>`<li>${nlS(full(w),'nlw')} = ${esc(w.ar)}</li>`).join('')}</ul></div>`:''}
      <p class="note" style="margin-top:10px">الألعاب للتدريب فقط، ولا تغيّر مواعيد مراجعة كلماتك.</p>

    document.getElementById('again').onclick=()=>pairs();
    const o=document.getElementById('other');if(o)o.onclick=()=>order();
    document.getElementById('h').onclick=()=>go(home);
    document.getElementById('again').focus({preventScroll:true});
  };
  go(round);
}

/* Word-order tips: the rule that makes Dutch sentences feel strange to Arabic speakers */
const QW=['waar','wat','hoe','wie','wanneer','welke','hoeveel','waarom','waarvoor'];
const IMP=new Set(['doe','neem','vul','zet','log','ga','bel','haal','stap','check','lees','kijk','kom','wacht','eet','stuur','spreek']);
const SUBJ=new Set(['ik','je','jij','hij','zij','ze','we','wij','u','het']);
const FIN=new Set(['ben','bent','is','zijn','was','heb','hebt','heeft','hebben','ga','gaat','gaan','kom','komt','komen','wil','wilt','willen','kan','kunt','kunnen','moet','moeten','mag','woon','woont','eet','eten','drink','drinken','werk','werkt','leer','leert','koop','kook','betaal','zoek','sta','staat','begint','kost','speelt','slaapt','stuurt','helpt','duurt','voel','schrijft','krijg','vraag','heet','begrijp','volg','doet','ligt','schijnt','valt','regent','draagt','vindt','zit','wacht','kijk','slaap','trek','zet','kookt','drink','waren','had','ging','kwam','zag','zei','deed','kocht','at','werkte','woonde','neemt','stuur','krijg','lees','bent','zegt','help','doe']);
const PART=new Set(['in','uit','mee','dicht','op','aan']);
const MOD=new Set(['kan','kunt','wil','wilt','moet','mag','ga','gaat','gaan']);
function orderTip(w){
  const t=sentTokens(w),cl=x=>(x||'').toLowerCase().replace(/[.,!?]/g,''),q=/\?$/.test(w.ex.trim());
  const last=cl(t[t.length-1]);
  const sep=PART.has(last)?` وانتبه: الجزء الثاني من الفعل (${nlS(last)}) يذهب إلى آخر الجملة.`:'';
  const q0=/,$/.test(t[0])?1:0,qi=[q0,q0+1].find(k=>QW.includes(cl(t[k])));
  const qe=qi!==undefined&&['lang','oud','laat','vaak'].includes(cl(t[qi+1]))?qi+1:qi;
  if(q&&qi!==undefined)return `في السؤال الذي يبدأ بكلمة استفهام (${nlS(t.slice(q0,qe+1).join(' '))})، يأتي الفعل بعدها مباشرة.`;
  if(q)return `في سؤال الجواب عنه «نعم» أو «لا»، يبدأ السؤال بالفعل: ${nlS(t[q0])}…؟`;
  if(IMP.has(cl(t[0])))return `هذه جملة أمر: يأتي الفعل أولاً بلا فاعل: ${nlS(t[0])}…`+sep;
  const comma=/,$/.test(t[0]),s=comma?t.slice(1):t;
  const vi=s.findIndex((x,k)=>FIN.has(cl(x))&&!(['het','de','een'].includes(cl(s[k-1]))&&/en$/.test(cl(x))));
  if(vi<0)return 'هذه عبارة ثابتة يقولها الهولنديون هكذا، فاحفظها كما هي.';
  const pre=comma?`الكلمة قبل الفاصلة (${nlS(t[0].replace(',',''))}) تقف وحدها. `:'';
  const inf=MOD.has(cl(s[vi]))&&/en$/.test(last)&&last!==cl(s[vi])?` والفعل الثاني (${nlS(last)}) يذهب إلى آخر الجملة.`:'';
  if(vi>=1&&!SUBJ.has(cl(s[0]))&&!SUBJ.has(cl(s[vi-1]))&&SUBJ.has(cl(s[vi+1])))
    return pre+`عندما تبدأ الجملة بالوقت أو بكلمة أخرى (${nlS(s.slice(0,vi).join(' '))})، يبقى الفعل ثانياً ويأتي الفاعل بعده: ${nlS(s.slice(0,vi+2).join(' '))}…`+inf+sep;
  return pre+`في الجملة العادية يأتي الفعل في المكان الثاني، بعد الفاعل: ${nlS(s.slice(0,vi+1).join(' '))}…`+inf+sep;
}
function order(){
  gStop();const P=met().filter(sentOK);if(!P.length)return go(home);
  const items=shuffle(weakFirst(P).slice(0,12)).slice(0,Math.min(5,P.length));
  let i=0,first=0;const tries={};
  const render=()=>{
    rerender=render;
    if(i>=items.length)return finish();
    const w=items[i],toks=sentTokens(w);
    let tiles=toks.map((t,k)=>({t,k}));
    for(let n=0;n<6;n++){tiles=shuffle(tiles);if(tiles.map(x=>x.t).join(' ')!==toks.join(' '))break}
    let placed=[],done=false;
    const draw=()=>{
      const left=tiles.filter(x=>!placed.includes(x));
      app.innerHTML=`<div class="card">
        <div class="head"><span class="chip">🧩 رتّب الجملة</span><span>${i+1} من ${items.length}</span></div>
        <div class="prog" role="progressbar" aria-label="التقدّم في اللعبة" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${i}"><i style="width:${Math.round(i/items.length*100)}%"></i></div>
        <p class="q">رتّب الكلمات لتكتب هذه الجملة بالهولندية:</p>
        <p class="mean" style="font-size:1.25em">${esc(w.exAr)}</p>
        <div class="sline${done?(done==='ok'?' ok':' bad'):''}" lang="nl" dir="ltr" aria-label="جملتك">${placed.length?placed.map((x,n)=>`<button class="tile" data-p="${n}" ${done?'disabled':''} aria-label="أزل ${esc(x.t)}">${esc(x.t)}</button>`).join(''):'<span class="ph">اضغط الكلمات بالترتيب…</span>'}</div>
        <div class="tiles" lang="nl" dir="ltr">${left.map(x=>`<button class="tile" data-k="${x.k}" ${done?'disabled':''}>${esc(x.t)}</button>`).join('')}</div>
        ${done?'':`<div class="row" style="justify-content:center"><button class="btn" id="chk" ${left.length?'disabled':''}>تحقّق</button><button class="tbtn" id="clr" ${placed.length?'':'disabled'}>ابدأ من جديد</button><button class="tbtn" id="hint"><span aria-hidden="true">💡</span> الكلمة التالية</button></div>`}
        <div id="fb"></div></div>
        <div class="row"><button class="btn ghost" id="q">الخروج إلى الرئيسية</button></div>`;
      document.getElementById('q').onclick=()=>go(home);
      if(!done){
        app.querySelectorAll('.tiles .tile').forEach(b=>b.onclick=()=>{placed.push(tiles.find(x=>x.k===+b.dataset.k));draw();const c=document.getElementById('chk');if(c&&!c.disabled)c.focus()});
        app.querySelectorAll('.sline .tile').forEach(b=>b.onclick=()=>{placed.splice(+b.dataset.p,1);draw()});
        document.getElementById('clr').onclick=()=>{placed=[];draw()};
        document.getElementById('hint').onclick=()=>{
          /* keep the correct start, then add the next right word */
          let n=0;while(n<placed.length&&placed[n].t===toks[n])n++;placed=placed.slice(0,n);
          const nx=tiles.find(x=>!placed.includes(x)&&x.t===toks[n]);if(nx)placed.push(nx);tries[i]=(tries[i]||0)+1;draw()};
        document.getElementById('chk').onclick=()=>{
          const ok=placed.map(x=>x.t).join(' ')===toks.join(' ');
          if(ok&&!tries[i])first++;
          done=ok?'ok':'bad';if(!ok)tries[i]=(tries[i]||0)+1;draw();
          document.getElementById('fb').innerHTML=`<div class="fb ${ok?'is-ok':'is-bad'}" role="status"><b>${ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]+' ✓':'ليس بالترتيب الصحيح ✗'}</b>
            ${ok?'':`<div style="margin-top:6px">الصحيح: ${nlS(w.ex,'nlw')}</div>`}
            <p style="margin:6px 0 0">💡 ${orderTip(w)}</p></div>

function speed(P0,next){
  gStop();const P=(P0&&P0.length>=4)?P0:met();if(P.length<4)return go(home);
  const END=Date.now()+60000;let right=0,wrong=0,last=null,ended=false;const missed=new Map();
  const q=()=>{
    rerender=q;
    if(Date.now()>=END)return end();
    let w;do{w=P[Math.floor(Math.random()*P.length)]}while(P.length>1&&w===last);last=w;
    const opts=shuffle([w,...shuffle(W.filter(x=>x.id!==w.id&&x.ar!==w.ar&&(x.th===w.th||Math.random()<.2))).slice(0,3)]);
    app.innerHTML=`<div class="card">
      <div class="head"><span class="chip">⏱️ جولة الـ60 ثانية</span><span><span id="tm">${Math.ceil((END-Date.now())/1000)}</span> ثانية · ✓ ${right}</span></div>
      <div class="prog"><i id="tbar" style="width:${Math.max(0,(END-Date.now())/600)}%"></i></div>
      <div class="word" lang="nl" dir="ltr">${art(w)}${esc(w.nl)}</div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${esc(o.id)}"><span class="kn" aria-hidden="true">${k+1}</span><span class="lbl">${esc(o.ar)}</span></button>`).join('')}</div></div>
      <div class="row"><button class="btn ghost" id="q">الخروج إلى الرئيسية</button></div>`;
    document.getElementById('q').onclick=()=>{gStop();go(home)};
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.k===w.id;ok?right++:(wrong++,missed.set(w.id,w));
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.k===w.id)x.classList.add('ok');else if(x===b)x.classList.add('bad')});
      setTimeout(q,ok?260:900);
    });
  };
  const tick=()=>{const t=document.getElementById('tm'),b=document.getElementById('tbar');const left=END-Date.now();
    if(left<=0){gStop();if(rerender===q)end();return}
    if(t)t.textContent=Math.ceil(left/1000);if(b)b.style.width=Math.max(0,left/600)+'%'};
  const end=()=>{
    if(ended)return;ended=true;gStop();const res={right,wrong,missed:[...missed.values()]};
    const rec=right>(gs.speedBest||0);if(rec){gs.speedBest=right}gSave();
    if(next)return next(res);
    rerender=end;const nb=checkBadges();
    app.innerHTML=`<div class="card result">${badgeHtml(nb)}<p class="lead" style="margin:0">إجابات صحيحة في دقيقة</p><div class="big">${right}</div>
      <p>${rec&&right?'🎉 رقم قياسي جديد!':'أفضل نتيجة لك: '+(gs.speedBest||0)}</p>
      ${missWords(res.missed)}
      <div class="row" style="justify-content:center"><button class="btn" id="again">جولة جديدة</button><button class="btn ghost" id="h">الرئيسية</button></div></div>`;
    document.getElementById('again').onclick=()=>speed(P0);document.getElementById('h').onclick=()=>go(home);
    document.getElementById('again').focus({preventScroll:true});
  };
  gTimer=setInterval(tick,250);go(q);
}

/* ---------- Level tests («اختبار آخر الشهر») ----------
   Test 1 = the first 60 words (one month of two words a day). Test A0 = all words of level A0.
   20 questions of 6 kinds, no hints and no feedback until the end, pass mark 80% (16 of 20).
   A wrong answer sends the word back to review (it is due again right away); right answers change nothing. */
const TESTS=[

 {id:'a0',n:'اختبار المستوى A0',sub:'كل كلمات المستوى الأول',from:0,to:A0N,ic:'🎓'},
 {id:'t3',n:'اختبار الشهر الثالث',sub:'أول 60 كلمة من المستوى A1',from:A0N,to:A0N+60,ic:'📗'},
 {id:'t4',n:'اختبار الشهر الرابع',sub:'الجزء الثاني من المستوى A1',from:A0N+60,to:A0N+120,ic:'📘'}
];
const PASS=0.8, TQ=20;
const KIND={mean:'المعنى',rev:'من العربية إلى الهولندية',listen:'الاستماع',art:'de / het',order:'ترتيب الجملة',type:'الكتابة'};
const ADVICE={mean:'راجع كلمات الأسبوع في «وصّل الأزواج».',rev:'جرّب «جولة الـ60 ثانية» لتتذكّر الكلمة الهولندية بسرعة.',listen:'في الدرس اضغط «ببطء» وردّد الكلمة بصوت عالٍ.',
  art:'احفظ كل اسم مع أداته: «de huis» خطأ، «het huis» صحيح.',order:'تذكّر: الفعل في المكان الثاني. العب «رتّب الجملة».',type:'اكتب الكلمة مرة أو مرتين في دفتر وأنت تسمعها.'};
const testWords=t=>W.slice(t.from,t.to);
const testOpen=t=>testWords(t).every(w=>st.w[w.id]);
const testLeft=t=>testWords(t).filter(w=>!st.w[w.id]).length;
const tState=id=>((gs.tests||{})[id])||{};
BADGES.push({id:'test1',ic:'📝',n:'اختبار الشهر الأول',d:'نجحت في اختبار أول 60 كلمة.',t:()=>!!tState('t1').passed},

            {id:'test3',ic:'📗',n:'اختبار الشهر الثالث',d:'نجحت في اختبار أول 60 كلمة من المستوى A1.',t:()=>!!tState('t3').passed},

function makeTest(t){
  const words=shuffle(testWords(t)),voice=voiceOK(),items=[];
  const plan=['mean','mean','mean','mean','mean','mean','rev','rev','rev','rev',voice?'listen':'mean',voice?'listen':'rev',voice?'listen':'mean','art','art','art','order','order','type','type'];
  const nouns=words.filter(w=>w.a),sents=words.filter(sentOK),used=new Set();
  const take=(list)=>{const w=list.find(x=>!used.has(x.id))||words.find(x=>!used.has(x.id));used.add(w.id);return w};
  plan.forEach(k=>{
    const w=take(k==='art'?nouns:k==='order'?sents:words);
    let kind=k;if(kind==='art'&&!w.a)kind='mean';if(kind==='order'&&!sentOK(w))kind='rev';
    const it={k:kind,w};
    if(kind==='mean'||kind==='rev'||kind==='listen')it.opts=shuffle([w,...shuffle(W.filter(x=>x.id!==w.id&&x.ar!==w.ar&&(x.th===w.th||Math.random()<.2))).slice(0,3)]);
    if(kind==='order'){let tl=sentTokens(w).map((x,i)=>({t:x,i}));for(let n=0;n<6;n++){tl=shuffle(tl);if(tl.map(x=>x.t).join(' ')!==w.ex.trim())break}it.tiles=tl}
    items.push(it);
  });
  return shuffle(items).slice(0,TQ);
}
function runTest(t){

  const intro=()=>{

    const it=items[i],w=it.w;let val=null,placed=[];
    const head=`<div class="head"><span class="chip">${t.ic} ${esc(t.n)}</span><span>السؤال ${i+1} من ${items.length}</span></div>

/* ---------- «أكمل الفراغ»: the word disappears from its real sentence ---------- */
function clozeOf(w){
  const key=w.nl.replace(/\?$/,''),ex=w.ex,i=ex.toLowerCase().indexOf(key.toLowerCase());
  if(i<0||key.length<2)return null;
  const L=/[A-Za-zÀ-ÿ]/;if(L.test(ex[i-1]||'')||L.test(ex[i+key.length]||''))return null;
  return {before:ex.slice(0,i),ans:ex.slice(i,i+key.length),after:ex.slice(i+key.length)};
}
const capLike=(t,like)=>/^[A-Z]/.test(like)?t.charAt(0).toUpperCase()+t.slice(1):t;
function cloze(){
  gStop();const P=met().filter(clozeOf);if(P.length<4)return go(home);
  const items=shuffle(weakFirst(P).slice(0,12)).slice(0,Math.min(6,P.length));
  let i=0,ok=0;const missed=new Map();
  const q=()=>{
    rerender=q;if(i>=items.length)return end();
    const w=items[i],c=clozeOf(w),typing=box(w.id)>=2;   /* strong words: type them; new words: choose */
    const opts=typing?[]:shuffle([w,...shuffle(P.filter(x=>x.id!==w.id&&x.th===w.th).concat(shuffle(P.filter(x=>x.id!==w.id&&x.th!==w.th)))).slice(0,3)]);
    app.innerHTML=`<div class="card">
      <div class="head"><span class="chip">✏️ أكمل الفراغ</span><span>${i+1} من ${items.length}</span></div>
      <div class="prog" role="progressbar" aria-label="التقدّم في اللعبة" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${i}"><i style="width:${Math.round(i/items.length*100)}%"></i></div>
      <p class="q">${typing?'اكتب الكلمة الناقصة:':'اختر الكلمة الناقصة:'}</p>
      <div class="ex cz" lang="nl" dir="ltr">${esc(c.before)}<span class="gap" id="gap">${typing?'?':'____'}</span>${esc(c.after)}</div>
      <p class="mean" style="font-size:1.1em">${esc(w.exAr)}</p>
      ${typing?`<input class="type" id="ti" lang="nl" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="اكتب الكلمة الناقصة بالهولندية"><div class="row" style="justify-content:center"><button class="btn" id="chk">تحقّق</button><button class="tbtn" id="hint"><span aria-hidden="true">💡</span> أول حرف</button></div>`
      :`<div class="opts">${opts.map((o,k)=>`<button class="opt nl" lang="nl" dir="ltr" data-k="${esc(o.id)}"><span class="kn" aria-hidden="true">${k+1}</span><span class="lbl">${esc(capLike(o.nl.replace(/\?$/,''),c.ans))}</span></button>`).join('')}</div>`}
      <div id="fb"></div></div>
      <div class="row"><button class="btn ghost" id="q">الخروج إلى الرئيسية</button></div>`;
    document.getElementById('q').onclick=()=>go(home);
    const answer=(right,picked)=>{
      if(right)ok++;else missed.set(w.id,w);
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.k===w.id)x.classList.add('ok');else if(x.dataset.k===picked)x.classList.add('bad')});
      const ti=document.getElementById('ti');if(ti){ti.disabled=true;ti.classList.add(right?'ok':'bad');document.getElementById('chk').disabled=true;document.getElementById('hint').disabled=true}
      const g=document.getElementById('gap');g.textContent=c.ans;g.classList.add(right?'ok':'bad');
      document.getElementById('fb').innerHTML=`<div class="fb ${right?'is-ok':'is-bad'}" role="status"><b>${right?PRAISE[Math.floor(Math.random()*PRAISE.length)]+' ✓':'الكلمة الصحيحة: '}</b>${right?'':nlS(c.ans,'nlw')} = ${esc(w.ar)}
        <p style="margin:6px 0 0">${right?'الكلمة في جملتها أسهل للتذكّر من الكلمة وحدها.':'اقرأ الجملة كاملة بصوت عالٍ مرة واحدة، فهذا يثبّت الكلمة.'}</p></div>
        <div class="row"><button class="btn" id="nx">${i+1<items.length?'الجملة التالية':'اعرض النتيجة'}</button><button class="tbtn" id="sx" aria-label="اسمع الجملة">${SPK} اسمع</button></div>`;
      document.getElementById('sx').onclick=()=>say(w.ex);
      document.getElementById('nx').onclick=()=>{i++;q();window.scrollTo(0,0)};document.getElementById('nx').focus({preventScroll:true});
      if(st.set.auto)say(w.ex);
    };
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.k===w.id,b.dataset.k));
    const ti=document.getElementById('ti');
    if(ti){const norm=s=>s.trim().toLowerCase().replace(/[?!.]/g,'').replace(/\s+/g,' ');
      const chk=()=>{if(!ti.value.trim())return;answer(norm(ti.value)===norm(c.ans),ti.value)};
      document.getElementById('chk').onclick=chk;ti.onkeydown=e=>{if(e.key==='Enter')chk()};
      document.getElementById('hint').onclick=()=>{ti.value=c.ans[0];ti.focus()};setTimeout(()=>ti.focus(),50)}
  };
  const end=()=>{
    rerender=end;if(ok===items.length&&items.length>=6)gs.cloze6=1;gs.clozePlayed=(gs.clozePlayed||0)+1;gSave();const nb=checkBadges();
    app.innerHTML=`<div class="card result">${badgeHtml(nb)}<p class="lead" style="margin:0">أكملت الجمل صحيحة</p><div class="big">${ok}/${items.length}</div>
      <p>${ok===items.length?'ممتاز! تعرف الكلمات في جملها الحقيقية.':'جيد! الكلمات القوية تطلب منك الكتابة، والجديدة تعطيك اختيارات.'}</p>
      ${missWords([...missed.values()])}
      <div class="row" style="justify-content:center"><button class="btn" id="again">جمل جديدة</button><button class="btn ghost" id="other">🔤 حزّورة الحروف</button><button class="btn ghost" id="h">الرئيسية</button></div></div>`;
    document.getElementById('again').onclick=()=>cloze();document.getElementById('other').onclick=()=>anagram();document.getElementById('h').onclick=()=>go(home);
    document.getElementById('again').focus({preventScroll:true});
  };
  go(q);
}

/* ---------- «حزّورة الحروف»: rebuild the word from mixed-up letters ---------- */
const anaOK=w=>/^[a-z]{3,10}$/.test(w.nl);
function anagram(){
  gStop();const P=met().filter(anaOK);if(P.length<3)return go(home);
  const items=shuffle(weakFirst(P).slice(0,12)).slice(0,Math.min(6,P.length));
  let i=0,pts=0,clean=0;
  const q=()=>{
    rerender=q;if(i>=items.length)return end();
    const w=items[i],L=w.nl.split('');let tiles=L.map((t,k)=>({t,k}));
    for(let n=0;n<8;n++){tiles=shuffle(tiles);if(tiles.map(x=>x.t).join('')!==w.nl)break}
    let placed=[],hints=0,solved=false;
    const draw=()=>{
      const left=tiles.filter(x=>!placed.includes(x));
      app.innerHTML=`<div class="card">
        <div class="head"><span class="chip">🔤 حزّورة الحروف</span><span>${i+1} من ${items.length} · ⭐ ${pts}</span></div>
        <div class="prog" role="progressbar" aria-label="التقدّم في اللعبة" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${i}"><i style="width:${Math.round(i/items.length*100)}%"></i></div>
        <p class="q">رتّب الحروف لتكتب الكلمة الهولندية التي تعني:</p>
        <p class="mean" style="font-size:1.5em">${esc(w.ar)}</p>
        ${w.a?`<p class="pron">اسم يأخذ ${nlS(w.a)}</p>`:''}
        <div class="slots" lang="nl" dir="ltr" aria-label="الكلمة" style="--n:${L.length}">${L.map((_,k)=>`<span class="slot${placed[k]?' on':''}${solved?' ok':''}">${placed[k]?esc(placed[k].t):''}</span>`).join('')}</div>
        <div class="tiles" lang="nl" dir="ltr">${left.map(x=>`<button class="tile ltr-tile" data-k="${x.k}" ${solved?'disabled':''}>${esc(x.t)}</button>`).join('')}</div>
        ${solved?'':`<div class="row" style="justify-content:center"><button class="tbtn" id="back" ${placed.length?'':'disabled'}>⌫ احذف حرفاً</button><button class="tbtn" id="hint"><span aria-hidden="true">💡</span> حرف صحيح (−3 ⭐)</button></div>`}
        <div id="fb"></div></div>
        <div class="row"><button class="btn ghost" id="q">الخروج إلى الرئيسية</button></div>`;
      document.getElementById('q').onclick=()=>go(home);
      if(solved)return;
      app.querySelectorAll('.tiles .tile').forEach(b=>b.onclick=()=>{placed.push(tiles.find(x=>x.k===+b.dataset.k));after()});
      document.getElementById('back').onclick=()=>{placed.pop();draw()};
      document.getElementById('hint').onclick=()=>{
        let n=0;while(n<placed.length&&placed[n].t===L[n])n++;placed=placed.slice(0,n);
        const nx=tiles.find(x=>!placed.includes(x)&&x.t===L[n]);if(nx){placed.push(nx);hints++}after()};
    };
    const after=()=>{
      if(placed.length<L.length)return draw();
      if(placed.map(x=>x.t).join('')===w.nl){
        solved=true;const got=Math.max(1,10-3*hints);pts+=got;if(!hints)clean++;draw();say(full(w));
        document.getElementById('fb').innerHTML=`<div class="fb is-ok" role="status"><b>${PRAISE[Math.floor(Math.random()*PRAISE.length)]} +${got} ⭐</b> ${nlS(full(w),'nlw')} = ${esc(w.ar)}
          ${st.set.pron?`<p style="margin:6px 0 0">اللفظ تقريباً: ${esc(w.p)}</p>`:''}</div>
          <div class="row"><button class="btn" id="nx">${i+1<items.length?'الكلمة التالية':'اعرض النتيجة'}</button><button class="tbtn" id="sx" aria-label="اسمع الكلمة">${SPK} اسمع</button></div>`;
        document.getElementById('sx').onclick=()=>say(full(w));
        document.getElementById('nx').onclick=()=>{i++;q();window.scrollTo(0,0)};document.getElementById('nx').focus({preventScroll:true});
      }else{
        draw();const s=app.querySelector('.slots');s.classList.add('bad');
        document.getElementById('fb').innerHTML='<p class="note" role="status" style="text-align:center">ليست الكلمة الصحيحة. احذف حرفاً أو اضغط «حرف صحيح».</p>';
      }
    };
    draw();
  };
  const end=()=>{
    rerender=end;const best=gs.anaBest||0;if(pts>best)gs.anaBest=pts;if(clean===items.length&&items.length>=6)gs.ana6=1;gSave();const nb=checkBadges();
    app.innerHTML=`<div class="card result">${badgeHtml(nb)}<p class="lead" style="margin:0">نقاطك</p><div class="big">⭐ ${pts}</div>
      <p>${clean===items.length?'رائع! حللت كل الحزازير بلا تلميح.':'حللت '+clean+' من '+items.length+' بلا تلميح.'} ${pts>best&&best?'🎉 رقم قياسي جديد!':best?'أفضل نتيجة لك: ⭐ '+best:''}</p>
      <div class="fb" style="text-align:start"><b>لماذا هذه اللعبة؟</b> عندما تبني الكلمة حرفاً حرفاً تحفظ طريقة كتابتها، وهذا يساعدك في امتحان الكتابة.</div>
      <div class="row" style="justify-content:center"><button class="btn" id="again">حزازير جديدة</button><button class="btn ghost" id="other">✏️ أكمل الفراغ</button><button class="btn ghost" id="h">الرئيسية</button></div></div>`;
    document.getElementById('again').onclick=()=>anagram();document.getElementById('other').onclick=()=>cloze();document.getElementById('h').onclick=()=>go(home);
    document.getElementById('again').focus({preventScroll:true});
  };
  go(q);
}

            {id:'ana6',ic:'🔤',n:'حلّال الحزازير',d:'حللت 6 حزازير بلا أي تلميح.',t:()=>!!gs.ana6});

/* ---------- Certificate: drawn on a canvas (so Arabic letters join correctly), saved as PDF or image ---------- */
const CERT_NL={t1:'Toets maand 1',a0:'Toets niveau A0',t3:'Toets maand 3',t4:'Toets maand 4'};
const JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
function certCode(t,name,date){let h=7;for(const c of t.id+name+date)h=Math.imul(h,31)+c.codePointAt(0)>>>0;return 'TL-'+t.id.toUpperCase()+'-'+h.toString(36).toUpperCase().slice(0,5)}
async function certCanvas(t,name,score,total,date){
  try{await Promise.all(['800 80px "Noto Kufi Arabic"','600 40px "IBM Plex Sans Arabic"','400 30px "IBM Plex Sans Arabic"'].map(f=>document.fonts.load(f)))}catch(e){}
  const W2=1754,H2=1240,c=document.createElement('canvas');c.width=W2;c.height=H2;const x=c.getContext('2d');
  const K='"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif',B='"IBM Plex Sans Arabic",Tahoma,sans-serif';
  x.fillStyle='#fffdf6';x.fillRect(0,0,W2,H2);
  x.strokeStyle='#1f4e96';x.lineWidth=16;x.strokeRect(40,40,W2-80,H2-80);
  x.strokeStyle='#f5c400';x.lineWidth=5;x.strokeRect(78,78,W2-156,H2-156);
  /* Dutch flag */
  [['#ae1c28',0],['#ffffff',1],['#21468b',2]].forEach(([col,k])=>{x.fillStyle=col;x.fillRect(W2/2-60,130+k*26,120,26)});
  x.strokeStyle='#d6dee9';x.lineWidth=2;x.strokeRect(W2/2-60,130,120,78);
  x.direction='rtl';x.textAlign='center';x.fillStyle='#5b6b82';
  const line=(txt,y,font,col)=>{x.font=font;x.fillStyle=col||'#14233a';x.fillText(txt,W2/2,y)};
  line('تعلّم الهولندية · taalam',265,'500 30px '+B,'#5b6b82');
  line('شهادة نجاح',375,'800 96px '+K,'#1f4e96');
  line('تُمنح هذه الشهادة إلى',470,'400 36px '+B,'#5b6b82');
  x.direction=/[؀-ۿ]/.test(name)?'rtl':'ltr';line(name,585,'800 80px '+K,'#14233a');x.direction='rtl';
  x.strokeStyle='#f5c400';x.lineWidth=4;x.beginPath();x.moveTo(W2/2-380,625);x.lineTo(W2/2+380,625);x.stroke();
  line('لاجتياز «'+t.n+'» بنجاح',705,'600 44px '+B,'#14233a');
  line(t.sub+' · النتيجة '+score+' من '+total,770,'400 34px '+B,'#14233a');
  x.direction='ltr';line('Certificaat · '+(CERT_NL[t.id]||t.id)+' · geslaagd',840,'italic 400 30px Georgia,"Times New Roman",serif','#1f4e96');x.direction='rtl';
  const d=new Date(date).toLocaleDateString('ar',{day:'numeric',month:'long',year:'numeric'});
  line('التاريخ: '+d,930,'400 30px '+B,'#14233a');
  line('رقم الشهادة: '+certCode(t,name,date),978,'400 26px '+B,'#5b6b82');
  line('شهادة تعلّم شخصية من موقع «تعلّم الهولندية»، وليست شهادة رسمية من الدولة.',1068,'400 24px '+B,'#5b6b82');
  line('المعماري : HAZEM ALHAMOUD',1132,'400 20px '+B,'#8a98ab');
  return c;
}
const certFile=t=>'شهادة-'+(CERT_NL[t.id]||t.id).replace(/\s+/g,'-');
function loadJsPDF(){return window.jspdf?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src=JSPDF;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function certBlock(t,score,total){
  return `<div class="certbox" style="text-align:start">
    <div class="cert" role="img" aria-label="شهادة نجاح"><small>تعلّم الهولندية · taalam</small><b>شهادة نجاح</b><span>${esc(t.n)}: ${esc(t.sub)}</span><span>النتيجة ${score} من ${total}</span></div>
    <label for="cn" style="font-weight:600;display:block;margin-top:10px">اسمك كما تريده على الشهادة</label>
    <input class="srch" id="cn" autocomplete="name" maxlength="40" value="${esc(ui.certName||'')}" placeholder="مثلاً: سارة أحمد">
    <div class="row" style="justify-content:center"><button class="btn" id="cpdf">📄 نزّل الشهادة (PDF)</button><button class="btn ghost" id="cimg">🖼️ اعرض الشهادة صورة</button></div>
    <p class="note" style="text-align:center">شهادة تعلّم شخصية من الموقع، وليست شهادة رسمية من الدولة.</p>
    <div id="cout" aria-live="polite"></div></div>`;
}
function certWire(t,score,total){
  const g=(gs.tests||{})[t.id]||{},date=g.passed||today(),inp=document.getElementById('cn'),out=document.getElementById('cout');
  const name=()=>{const n=inp.value.trim().replace(/\s+/g,' ');if(!n){out.innerHTML='<p class="warn" role="alert">اكتب اسمك أولاً، ثم اضغط الزر مرة أخرى.</p>';inp.focus();return ''}uiSet('certName',n);return n};
  document.getElementById('cimg').onclick=async()=>{const n=name();if(!n)return;
    const c=await certCanvas(t,n,score,total,date);
    out.innerHTML=`<img class="certimg" src="${c.toDataURL('image/png')}" alt="شهادة نجاح باسم ${esc(n)}"><p class="note" style="text-align:center">لحفظ الصورة: اضغط عليها مطوّلاً على الموبايل، أو بالزر الأيمن على الكمبيوتر.</p>`};
  document.getElementById('cpdf').onclick=async()=>{const n=name();if(!n)return;
    const b=document.getElementById('cpdf');b.disabled=true;b.textContent='لحظة…';
    try{const c=await certCanvas(t,n,score,total,date);await loadJsPDF();
      const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
      doc.addImage(c.toDataURL('image/jpeg',0.93),'JPEG',0,0,297,210);
      doc.setProperties({title:'شهادة نجاح: '+t.n,subject:'taalam',author:'HAZEM ALHAMOUD',creator:'taalam'});
      doc.save(certFile(t)+'.pdf');
      out.innerHTML='<p class="note" role="status" style="text-align:center">✓ بدأ التنزيل. إن لم يبدأ، اضغط «اعرض الشهادة صورة» واحفظ الصورة.</p>';
    }catch(e){out.innerHTML='<p class="warn" role="alert">لم يعمل التنزيل الآن. اضغط «اعرض الشهادة صورة» واحفظ الصورة بدلاً منه.</p>'}
    b.disabled=false;b.textContent='📄 نزّل الشهادة (PDF)'};
}
function certPage(t){
  rerender=()=>certPage(t);const g=tState(t.id),total=TQ,score=g.passScore||g.best||0;
  app.innerHTML=`<div class="card"><div class="head"><span class="chip">${t.ic} ${esc(t.n)}</span><span>نجحت ✓</span></div>${certBlock(t,score,total)}</div>
    <div class="row"><button class="btn ghost" id="b">رجوع إلى الرئيسية</button></div>`;
  certWire(t,score,total);document.getElementById('b').onclick=()=>go(home);
}

/* ---------- Word list ---------- */
function words(th){
  rerender=()=>words(th);
  const t=th?themeOf(th):null;
  const list=t?t.w.map(r=>byId[r[0]]):W;
  const stName={s2:'ثابتة',s1:'بدأت تعلّمها','':'لم تبدأها بعد'};
  app.innerHTML=`<section><h1>${t?`<span aria-hidden="true">${t.ic}</span> ${t.n}`:'كل الكلمات'}</h1>
    <div class="legend"><span><i class="st s2"></i>ثابتة</span><span><i class="st s1"></i>بدأت تعلّمها</span><span><i class="st"></i>لم تبدأها بعد</span></div>
    <label class="sr" for="s">ابحث عن كلمة</label>
    <input class="srch" id="s" type="search" placeholder="ابحث بالعربية أو بالهولندية…" autocomplete="off" spellcheck="false" enterkeyhint="search">
    <div class="cnt" id="cnt" aria-live="polite"></div>
    <div class="panel list" id="L"></div>
    <div class="row"><button class="btn ghost" id="b">رجوع إلى الرئيسية</button></div></section>`;
  const draw=q=>{q=(q||'').trim();const ql=q.toLowerCase(),qa=normAr(q);
    const hits=list.filter(w=>!q||full(w).toLowerCase().includes(ql)||normAr(w.ar).includes(qa));
    document.getElementById('cnt').textContent=q?(hits.length?'النتائج: '+hits.length:''):'عدد الكلمات: '+list.length;
    document.getElementById('L').innerHTML=hits.map(w=>{const b=box(w.id),s=st.w[w.id]?(b>=2?'s2':'s1'):'';
      return `<div class="it"><span class="st ${s}" role="img" aria-label="${stName[s]}"></span><div><span class="nlw" lang="nl" dir="ltr">${esc(full(w))}</span> <small style="display:inline">${st.set.pron?'· '+esc(w.p):''}</small><small>${esc(w.ar)}</small></div><button class="tbtn" data-s="${esc(w.id)}" aria-label="اسمع: ${esc(full(w))}">${SPK}</button></div>`}).join('')
      ||`<div class="empty"><p>لا توجد كلمة تطابق «${esc(q)}». جرّب كلمة أقصر، أو ابحث بالعربية أو بالهولندية.</p><button class="btn ghost sm" id="clr">امسح البحث</button></div>`;
    document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>say(full(byId[b.dataset.s])));
    const c=document.getElementById('clr');if(c)c.onclick=()=>{const s=document.getElementById('s');s.value='';draw('');s.focus()}};
  draw();document.getElementById('s').oninput=e=>draw(e.target.value);
  document.getElementById('b').onclick=()=>go(home);
}

/* ---------- Settings ---------- */
function settings(){
  rerender=settings;
  const seg=(key,label,opts)=>`<div class="seg" role="group" aria-label="${label}" data-key="${key}">${opts.map(([v,l])=>`<button aria-pressed="${String(st.set[key])===String(v)}" class="${String(st.set[key])===String(v)?'on':''}" data-v="${v}">${l}</button>`).join('')}</div>`;
  const onoff=[[1,'تشغيل'],[0,'إيقاف']];
  app.innerHTML=`<section><h1>الإعدادات</h1>
  <div class="panel">
    <div class="set"><strong>كم كلمة جديدة كل يوم؟</strong><p class="d">كلمتان كل يوم تكفيان لتحفظ أكثر من 700 كلمة في السنة. القليل كل يوم أفضل من الكثير مرة واحدة.</p>${seg('per','عدد الكلمات الجديدة كل يوم',[[2,'2'],[3,'3'],[5,'5']])}</div>
    <div class="set"><strong>نطق الكلمة تلقائياً</strong>${seg('auto','نطق الكلمة تلقائياً',onoff)}</div>
    <div class="set"><strong>اللفظ بالحروف العربية</strong><p class="d">مفيد في البداية. اللفظ تقريبي، والأدق دائماً هو الصوت.</p>${seg('pron','اللفظ بالحروف العربية',onoff)}</div>
    <div class="set"><strong>خط كبير</strong>${seg('big','خط كبير',onoff)}</div>
    <div class="set"><strong>الصوت الهولندي</strong><p class="d">${AUD?'أصوات هولندية مسجّلة مسبقاً (فينّا ومارتن)، فتسمع النطق نفسه على كل الأجهزة.':!canSpeak?'هذا المتصفح لا يدعم الصوت.':nlVoice?'صوت المتصفح: '+esc(nlVoice.name)+'. النطق قد يختلف من جهاز إلى آخر.':'لا يوجد صوت هولندي في هذا المتصفح. جرّب Edge أو Chrome.'}</p><button class="tbtn" id="t">${SPK} جرّب: ${nlS('Goedemorgen!')}</button></div>
    <div class="set"><strong>البدء من جديد</strong><p class="d">يمسح كل تقدّمك في الكلمات.</p><button class="btn ghost sm" id="reset">امسح التقدّم</button></div>
  </div>
  <div class="row"><button class="btn" id="d">رجوع إلى الرئيسية</button></div></section>`;
  app.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{const key=s.dataset.key,v=b.dataset.v;
    st.set[key]=+v;save();document.body.classList.toggle('big',!!st.set.big);settings();toast('تم الحفظ ✓');
    const nb=app.querySelector(`.seg[data-key="${key}"] [data-v="${v}"]`);if(nb)nb.focus()}));
  document.getElementById('t').onclick=()=>say('Goedemorgen!');
  document.getElementById('reset').onclick=()=>ask('هل تريد حقاً مسح كل تقدّمك؟ لا يمكن التراجع عن ذلك.',()=>{st.w={};st.day={d:'',fresh:0,done:0};st.streak={last:'',n:0};save();go(home);toast('تم مسح التقدّم. يمكنك البدء من جديد.')},'نعم، امسح','إلغاء');
  document.getElementById('d').onclick=()=>go(home);
}

document.getElementById('hdr-set').onclick=()=>go(settings);
document.getElementById('home-link').onclick=()=>go(home);
/* Keyboard: 1-4 picks an answer, Enter goes on (when no button or field has the focus) */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||document.querySelector('.askbg,.tl-bg'))return;
  const tag=e.target.tagName;
  if(/^[1-4]$/.test(e.key)&&tag!=='INPUT'){const b=app.querySelectorAll('.opt:not([disabled])')[+e.key-1];if(b){e.preventDefault();b.click()}return}
  if(e.key==='Enter'&&!/^(INPUT|BUTTON|A|TEXTAREA|SELECT|SUMMARY)$/.test(tag)){const n=document.getElementById('nx');if(n&&!n.disabled){e.preventDefault();n.click()}}
});
/* Account: header button + trial banner */
(function(){const b=document.getElementById('hdr-acc'),l=document.getElementById('acc-l');if(!window.Taalam||!b)return;
  b.onclick=()=>Taalam.account();
  const upd=()=>{const u=Taalam.user();l.textContent=u?'حسابي':'دخول';b.setAttribute('aria-label',u?'حسابي: '+u.email:'تسجيل الدخول أو إنشاء حساب')};
  Taalam.onChange(()=>{upd();if(rerender===home)home()});upd()})();
home();
</script>

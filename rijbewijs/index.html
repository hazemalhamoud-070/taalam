<style>
/* One narrow study column, ANWB-sign palette: signpost blue header, reflective white cards, yellow priority accents */
:root{
  --bg:#eef2f7; --card:#ffffff; --ink:#14233a; --muted:#5b6b82; --line:#d6dee9;
  --blue:#1f4e96; --blue-soft:#e3ecf8; --yellow:#f5c400; --red:#c8202f;
  --ok:#1d7a46; --ok-soft:#e2f3e9; --bad:#b3261e; --bad-soft:#fbe6e4;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --fs:16px; --lh:1.7; --pad:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1622; --card:#16212f; --ink:#e6edf6; --muted:#9aabc2; --line:#2a394d;
  --blue:#5b8fdc; --blue-soft:#1b2c44; --yellow:#f5c400; --red:#e5484d;
  --ok:#4cc38a; --ok-soft:#143326; --bad:#ff6b61; --bad-soft:#3a1c1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1622; --card:#16212f; --ink:#e6edf6; --muted:#9aabc2; --line:#2a394d;
  --blue:#5b8fdc; --blue-soft:#1b2c44; --yellow:#f5c400; --red:#e5484d;
  --ok:#4cc38a; --ok-soft:#143326; --bad:#ff6b61; --bad-soft:#3a1c1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:var(--lh)}
body.sz2{--fs:19px} body.sz3{--fs:22px}
body.ease{--lh:2;--pad:16px;letter-spacing:.01em;word-spacing:.08em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--blue);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.brand .plate{background:var(--yellow);color:#14233a;border-radius:4px;padding:0 7px;font-size:12px;letter-spacing:.06em;font-family:var(--f-body);font-weight:600}
.spacer{flex:1}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.hbtn.on{background:#fff;color:var(--blue)}
.langs{display:flex;gap:4px}
.langs .hbtn{padding:5px 8px;min-width:34px;justify-content:center}
.hbtn svg{width:18px;height:18px}
.hbtn:focus-visible,button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:1.6em;line-height:1.4} h2{font-size:1.25em} h3{font-size:1em}
:lang(tr) h1,:lang(nl) h1,:lang(tr) h2,:lang(nl) h2{font-family:var(--f-body);font-weight:700}
.lead{color:var(--muted);margin:6px 0 0}
section{margin-top:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.3em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.8em;line-height:1.4;display:block}
.goal{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.goal i{display:block;height:100%;background:var(--yellow)}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:start;font:inherit;color:inherit;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.mode:hover{border-color:var(--blue)}
.mode.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.mode.primary small{color:#dce7f7}
.mode strong{display:block;font-size:1em}
.mode small{color:var(--muted);font-size:.82em;line-height:1.5;display:block}
.mode .ic{flex:none;width:40px;height:40px}
.nextstep{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:var(--card);border:2px solid var(--yellow);border-radius:14px;padding:14px;margin-top:12px}
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.topic{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font:inherit;color:inherit;text-align:start;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.topic:hover{border-color:var(--blue)}
.topic .nm{font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.topic .meta{font-size:.75em;color:var(--muted);font-variant-numeric:tabular-nums}
.rules{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 16px;margin-top:12px}
.rule{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .k{width:24px;height:24px;border-radius:50%;background:var(--yellow);color:#14233a;font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:3px}
.rule .nl{font-size:.8em;color:var(--blue);direction:ltr;unicode-bidi:isolate;font-weight:600}
.rule .pic{margin-top:8px;max-width:300px}
.rule .pic svg{width:100%;height:auto;border-radius:8px;display:block}
.rule .pic.sg{max-width:84px}
.tipbox{margin-top:12px;background:var(--blue-soft);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.tipbox b{display:block;color:var(--blue)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.82em;font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
.chip{background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:2px 10px;font-size:.9em;font-weight:600}
.qtext{font-size:1.12em;font-weight:600;margin:12px 0 4px}
.help{color:var(--muted);font-size:.85em;line-height:1.55;margin-top:2px}
.qsign{display:flex;justify-content:center;margin:10px 0 8px}
.qsign svg{width:130px;height:130px}
.qsign.small svg{width:72px;height:72px;opacity:.9}
.qscene{margin:12px 0 8px}
.qscene svg{width:100%;max-width:480px;height:auto;display:block;margin:0 auto;border-radius:10px;border:1px solid var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.tbtn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85em;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tbtn svg{width:16px;height:16px}
.tbtn[disabled]{opacity:.45;cursor:default}
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);color:inherit;border-radius:10px;padding:var(--pad) 14px;text-align:start;font:inherit;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt .ltr{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:.8em;font-weight:700;margin-top:2px}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--blue);background:var(--blue-soft)}
.opt.gone{opacity:.35;text-decoration:line-through}
.opt[disabled]{cursor:default}
.why{margin-top:14px;border-inline-start:4px solid var(--yellow);background:var(--bg);border-radius:8px;padding:10px 14px}
.why b{font-family:var(--f-display)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seg button{border:1.5px solid var(--line);background:var(--card);color:inherit;border-radius:999px;padding:6px 14px;font:inherit;font-size:.9em;cursor:pointer}
.seg button.on{border-color:var(--blue);background:var(--blue);color:#fff}
.set{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.set .d{color:var(--muted);font-size:.85em;margin:2px 0 0}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.sm{padding:6px 12px;font-size:.88em}
.btn[disabled]{opacity:.45;cursor:default}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--blue);transition:width .25s}
.result{text-align:center;padding:26px 16px}
.result .big{font-family:var(--f-display);font-size:3em;font-variant-numeric:tabular-nums}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.flash{min-height:220px;display:grid;place-items:center;text-align:center;cursor:pointer}
.flash .ans{color:var(--ok);font-weight:600;font-size:1.12em}
.lessons .item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px}
.lessons .item .src{font-size:.75em;color:var(--muted)}
.methods li{margin:6px 0}
.note{font-size:.8em;color:var(--muted);margin-top:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.learncard{border:2px dashed var(--ok)}
.learncard .ans{color:var(--ok);font-weight:700;font-size:1.08em;margin-top:8px}
@media (max-width:560px){.modes,.topics{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.brand .plate{display:none}.brand{font-size:16px}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

<script>
/* ---------- Sign drawer (simple Dutch-style road signs) ---------- */
const S={
 circle:(ring,fill,inner)=>`<svg viewBox="0 0 100 100" role="img"><circle cx="50" cy="50" r="46" fill="${fill}" stroke="${ring}" stroke-width="${ring==='none'?0:10}"/>${inner||''}</svg>`,
 tri:(inner)=>`<svg viewBox="0 0 100 100" role="img"><path d="M50 8 L94 88 H6 Z" fill="#fff" stroke="#c8202f" stroke-width="9" stroke-linejoin="round"/>${inner||''}</svg>`,
 inv:()=>`<svg viewBox="0 0 100 100" role="img"><path d="M6 14 H94 L50 92 Z" fill="#fff" stroke="#c8202f" stroke-width="9" stroke-linejoin="round"/></svg>`,
 dia:()=>`<svg viewBox="0 0 100 100" role="img"><rect x="18" y="18" width="64" height="64" transform="rotate(45 50 50)" fill="#fff" stroke="#222" stroke-width="2"/><rect x="29" y="29" width="42" height="42" transform="rotate(45 50 50)" fill="#f5c400"/></svg>`,
 sq:(fill,inner)=>`<svg viewBox="0 0 100 100" role="img"><rect x="6" y="6" width="88" height="88" rx="6" fill="${fill}" stroke="#fff" stroke-width="3"/>${inner||''}</svg>`,
 oct:()=>`<svg viewBox="0 0 100 100" role="img"><path d="M30 4 H70 L96 30 V70 L70 96 H30 L4 70 V30 Z" fill="#c8202f" stroke="#fff" stroke-width="3"/><text x="50" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#fff" font-family="Arial">STOP</text></svg>`,
 t:(txt,size,color,y)=>`<text x="50" y="${y||62}" text-anchor="middle" font-size="${size||34}" font-weight="700" fill="${color||'#111'}" font-family="Arial">${txt}</text>`,

 side:(x,y,c,s)=>`<g transform="translate(${x} ${y}) scale(${s||1})"><path d="M0 22 V12 L10 10 L20 0 H46 L56 10 L66 12 V22 Z" fill="${c}"/><path d="M23 3 H44 L51 10 H18 Z" fill="#cfe3f5"/><circle cx="14" cy="22" r="6" fill="#222"/><circle cx="54" cy="22" r="6" fill="#222"/></g>`
};
const RAYH='<path d="M52 34 H76 M52 44 H76 M52 56 H76 M52 66 H76"/>';
const RAYL='<path d="M52 36 L74 44 M52 46 L74 54 M52 56 L74 64 M52 66 L74 74"/>';

 B6:S.inv(), B1:S.dia(), STOP:S.oct(),

 F3:S.circle('#c8202f','#fff',`<rect x="18" y="40" width="30" height="20" fill="#c8202f"/>`+S.car(56,'#111')),
 E1:S.circle('#c8202f','#1f4e96',`<path d="M22 22 L78 78" stroke="#c8202f" stroke-width="10"/>`),
 E2:S.circle('#c8202f','#1f4e96',`<path d="M22 22 L78 78 M78 22 L22 78" stroke="#c8202f" stroke-width="10"/>`),

 G13:S.sq('#1f4e96',`<text x="50" y="40" text-anchor="middle" font-size="16" fill="#fff" font-family="Arial">fietspad</text>`+`<g transform="translate(18,30) scale(.64)">${S.bike()}</g>`),
 A50:S.circle('#c8202f','#fff',S.t('50')),
 A130:S.circle('#c8202f','#fff',S.t('130',27,'#111',60)),
 P:S.sq('#1f4e96',S.t('P',60,'#fff',72)),
 J_SIG:S.tri(`<rect x="42" y="38" width="16" height="40" rx="3" fill="#222"/><circle cx="50" cy="46" r="4" fill="#e33"/><circle cx="50" cy="57" r="4" fill="#fc0"/><circle cx="50" cy="68" r="4" fill="#3c3"/>`),

 WOONERF:S.sq('#1f4e96',`<path d="M20 70 L34 54 L48 70 Z" fill="#fff"/><circle cx="66" cy="44" r="6" fill="#fff"/><path d="M66 50 V66 M58 76 L66 66 L74 76" stroke="#fff" stroke-width="5"/>`),
 ABS:S.circle('none','#111',S.t('ABS',26,'#f5a300',58)),

 const turnPath=(k,t,lx,d)=>{const y0=d-18;

  return t==='r'?`M${lx} ${y0}L${lx} 34C${lx} 18 20 12 34 12L95 12`:t==='l'?`M${lx} ${y0}L${lx} 30C${lx} -2 4 -12 -30 -12L-95 -12`:`M${lx} ${y0}L${lx} -95`};

{id:'signs',sign:'J_SIG',n:{ar:'اللافتات والخطوط',tr:'Levhalar ve çizgiler',nl:'Borden en markering'},
 tip:{ar:'الشكل يخبرك بالمعنى: دائرة حمراء = ممنوع، دائرة زرقاء = إلزام، مثلث = انتبه، مربع = معلومة.',tr:'Şekil anlamı söyler: kırmızı daire = yasak, mavi daire = zorunlu, üçgen = dikkat, kare = bilgi.',nl:'De vorm zegt het al: rood rond = verbod, blauw rond = gebod, driehoek = waarschuwing, vierkant = informatie.'},
 rules:[

const hid=s=>{let h=5381;for(const c of s)h=Math.imul(h,33)^c.codePointAt(0);return (h>>>0).toString(36)};
{const used={};Q.forEach(x=>{let id='q'+hid(x.t+'|'+(x.src||'')+'|'+x.L.nl[0]);while(used[id])id+='x';used[id]=1;x.id=id})}

/* ---------- State (same storage key, so old progress is kept) ---------- */
const KEY='rijbewijs-study-v1', DAY=864e5;
let st={box:{},seen:{},wrong:{},exams:[],due:{},day:{d:'',n:0},streak:{last:'',n:0},set:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)st=Object.assign(st,s)}catch(e){}
if(!st.v){/* old saves used the list position; move them to the stable id */
  const OLD=['box','seen','wrong','due'];OLD.forEach(f=>{const o=st[f]||{},n={};for(const k in o){const q=Q[+k];if(q)n[q.id]=o[k]}st[f]=n});
  st.v=2;}

function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
function tick(){const d=today();
  if(st.day.d!==d)st.day={d,n:0};st.day.n++;
  if(st.streak.last!==d){const y=new Date(Date.now()-DAY).toISOString().slice(0,10);st.streak={last:d,n:st.streak.last===y?st.streak.n+1:1}}}
const GAP=[0,1,2,4,8];
function mark(q,ok){
  st.seen[q.id]=(st.seen[q.id]||0)+1;
  const b=st.box[q.id]||0;
  st.box[q.id]=ok?Math.min(b+1,4):0;
  if(!ok)st.wrong[q.id]=(st.wrong[q.id]||0)+1;
  st.due[q.id]=Date.now()+GAP[st.box[q.id]]*DAY;
  tick();save();return b;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function smartPick(pool,n){
  const now=Date.now();
  const sc=pool.map(q=>{const due=(st.due[q.id]||0)<=now;return{q,s:(due?0:40)+(st.box[q.id]||0)*10+(st.seen[q.id]?0:-5)+(st.wrong[q.id]?-4:0)+Math.random()*6}});
  return sc.sort((a,b)=>a.s-b.s).slice(0,n).map(x=>x.q);
}

/* ---------- Practice quiz (adaptive) ---------- */
function quiz(list0,label){
  clearTimer();
  const lab=()=>typeof label==='function'?label():label;const list=list0.slice();let i=0,score=0,answered=0;const retried={},wrongT={},got={};
  const st0={};
  const render=()=>{
    rerender=render;stopSpeak();

    const q=list[i];
    const order=st0[i]||(st0[i]=q.L.ar[1].length>2?shuffle([...q.L.ar[1].keys()]):[...q.L.ar[1].keys()]);
    if(st.set.learn&&!st.seen[q.id]&&!st0['L'+i])return learnCard(q);
    app.innerHTML=`<div class="qcard">${qBlock(q,i,list.length,lab())}
      <div class="tools"><button class="tbtn" id="say">${IC.spk} ${T('listen')}</button><button class="tbtn" id="hint">${IC.bulb} ${T('hint')}</button></div>
      <div class="opts">${optBtns(q,order)}</div><div id="fb"></div></div>
      <div class="row"><button class="btn ghost" id="quit">${T('quit')}</button></div>`;
    document.getElementById('say').onclick=()=>speak(qSpeech(q));
    document.getElementById('hint').onclick=e=>{
      const wrong=order.filter(k=>k!==q.a);const btn=[...app.querySelectorAll('.opt')].find(b=>+b.dataset.k===wrong[Math.floor(Math.random()*wrong.length)]);
      if(q.L.ar[1].length>2&&btn){btn.disabled=true;btn.classList.add('gone')}
      e.currentTarget.disabled=true;
      document.getElementById('fb').innerHTML=`<div class="tipbox"><span style="width:22px;flex:none;color:var(--blue)">${IC.bulb}</span><div><b>${T('tip')}</b>${esc(topicOf(q.t==='exam'?'prio':q.t).tip[L])}</div></div>`;
    };
    const pick=(k,replay)=>{
      const ok=k===q.a;let prev,extra='';
      if(replay){prev=got[i].prev;extra=got[i].extra}
      else{if(ok)score++; answered++;
        prev=mark(q,ok);
        if(!ok)wrongT[q.t]=(wrongT[q.t]||0)+1;
        if(!ok&&st.set.retry&&(retried[q.id]||0)<2){retried[q.id]=(retried[q.id]||0)+1;list.splice(Math.min(i+4,list.length),0,q);extra=1}
        got[i]={k,prev,extra};}
      if(extra)extra=`<p class="note" style="margin:6px 0 0">${T('retryNote')}</p>`;
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const kk=+x.dataset.k;if(kk===q.a)x.classList.add('ok');else if(kk===k)x.classList.add('bad')});
      const r=tx(q),hl=helpL();
      document.getElementById('fb').innerHTML=`<div class="why"><b>${ok?T('correct')+' ✓':T('wrongA')+' ✗'}</b> ${esc(r.e)}${hl?hspan(tx(q,hl).e,hl):''}${extra}</div>
        ${ok?`<div class="seg" id="conf"><button class="on" data-c="1">${T('sure')}</button><button data-c="0">${T('guess')}</button></div>`:''}
        <div class="row"><button class="btn" id="nx">${i+1<list.length?T('nextQ'):T('result')}</button><button class="tbtn" id="saye">${IC.spk}</button></div>`;
      if(ok)document.querySelectorAll('#conf button').forEach(c=>c.onclick=()=>{
        document.querySelectorAll('#conf button').forEach(x=>x.classList.toggle('on',x===c));
        if(c.dataset.c==='0'){st.box[q.id]=Math.max(0,prev-1);st.due[q.id]=Date.now();save();if(!retried[q.id]){retried[q.id]=1;list.splice(Math.min(i+5,list.length),0,q)}
          if(!document.getElementById('gn'))document.getElementById('conf').insertAdjacentHTML('afterend',`<p class="note" id="gn" style="margin:6px 0 0">${T('guessNote')}</p>`)}
      });
      document.getElementById('saye').onclick=()=>speak((ok?T('correct'):T('wrongA'))+'. '+r.o[q.a]+'. '+r.e);
      document.getElementById('nx').onclick=()=>{i++;render();window.scrollTo(0,0)};
      document.getElementById('nx').focus({preventScroll:true});
      if(st.set.tts&&!replay)speak((ok?T('correct'):T('wrongA'))+'. '+r.e);
    };
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
    document.getElementById('quit').onclick=()=>go(home);
    if(got[i])return pick(got[i].k,true);
    if(st.set.tts)setTimeout(()=>speak(qSpeech(q)),150);
  };
  const learnCard=q=>{
    const r=tx(q),hl=helpL();
    app.innerHTML=`<div class="qcard learncard">${qBlock(q,i,list.length,lab())}
      <div class="why" style="border-color:var(--ok)"><b>${T('learnFirst')}</b> <span class="lead">${T('learnD')}</span>
      <div class="ans">${T('answer')}: ${esc(r.o[q.a])}</div>${hl?hspan(tx(q,hl).o[q.a],hl):''}
      <p style="margin:6px 0 0">${esc(r.e)}</p>${hl?hspan(tx(q,hl).e,hl):''}</div>
      <div class="row"><button class="btn" id="got">${T('gotIt')}</button><button class="tbtn" id="say">${IC.spk} ${T('listen')}</button></div></div>
      <div class="row"><button class="btn ghost" id="quit">${T('quit')}</button></div>`;
    const sayIt=()=>speak(r.q+'. '+T('answer')+': '+r.o[q.a]+'. '+r.e);
    document.getElementById('say').onclick=sayIt;
    document.getElementById('got').onclick=()=>{st0['L'+i]=1;render();window.scrollTo(0,0)};
    document.getElementById('quit').onclick=()=>go(home);
    if(st.set.tts)setTimeout(sayIt,150);
  };
  const done=()=>{
    rerender=done;
    const weakT=Object.entries(wrongT).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([t])=>topicOf(t));
    app.innerHTML=`<div class="qcard result"><div class="big">${score}/${answered}</div><p>${score===answered?T('allRight'):T('someWrong')}</p>
    ${weakT.length?`<p class="lead">${T('focusOn')} ${weakT.map(t=>`<button class="btn ghost sm" data-t="${t.id}">${t.n[L]}</button>`).join(' ')}</p>`:''}
    <div class="row" style="justify-content:center"><button class="btn" id="again">${T('newRound')}</button><button class="btn ghost" id="h">${T('home')}</button></div></div>`;
    document.getElementById('again').onclick=()=>quiz(smartPick(Q,st.set.len),()=>T('smart'));
    document.getElementById('h').onclick=()=>go(home);
    app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>go(()=>topic(b.dataset.t)));
  };
  go(render);
}

/* ---------- Mock exam ---------- */
function exam(){
  clearTimer();
  const N=Math.min(50,Q.length),PASS=44,list=shuffle(Q).slice(0,N),ans=new Array(N).fill(null);
  const orders=list.map(q=>q.L.ar[1]===YN.ar?[...q.L.ar[1].keys()]:shuffle([...q.L.ar[1].keys()]));inExam=true;
  let i=0,left=30*60;const calm=!!st.set.calm;
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const render=()=>{
    rerender=render;const q=list[i],order=orders[i];
    app.innerHTML=`<div class="qcard"><div class="qhead"><span class="chip">${T('examChip')}</span>${calm?'':`<span class="timer" id="tm">${fmt(left)}</span>`}</div>${qBlock(q,i,N,T('q'),1)}
    <div class="tools"><button class="tbtn" id="say">${IC.spk} ${T('listen')}</button></div>
    <div class="opts">${optBtns(q,order,k=>ans[i]===k?'pick':'')}</div>
    <div class="row"><button class="btn ghost" id="pv" ${i?'':'disabled'}>${T('prev')}</button>${i<N-1?`<button class="btn" id="nx">${T('nextB')}</button>`:`<button class="btn" id="fin">${T('submit')}</button>`}</div></div>
    <div class="row"><button class="btn ghost" id="quit">${T('quit')}</button></div>`;
    document.getElementById('say').onclick=()=>speak(qSpeech(q));
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;render()});
    document.getElementById('pv').onclick=()=>{i--;render()};
    const nx=document.getElementById('nx');if(nx)nx.onclick=()=>{i++;render();window.scrollTo(0,0)};
    const fin=document.getElementById('fin');if(fin)fin.onclick=()=>{const open=ans.filter(a=>a===null).length;ask(T('cfSubmit')+(open?' '+T('cfOpen',{n:open}):''),finish)};
    document.getElementById('quit').onclick=()=>{ask(T('cfQuit'),()=>go(home))};
  };
  let res=null;
  const finish=()=>{
    clearTimer();inExam=false;
    if(!res){let s=0;list.forEach((q,k)=>{const ok=ans[k]===q.a;if(ok)s++;mark(q,ok)});st.exams.push({s,n:N,d:Date.now()});save();res=s}
    showRes();
  };
  const showRes=()=>{
    rerender=showRes;const s=res;
    const wrong=list.map((q,k)=>({q,k})).filter(x=>ans[x.k]!==x.q.a);
    app.innerHTML=`<div class="qcard result"><div class="big ${s>=PASS?'pass':'fail'}">${s}/${N}</div><p>${s>=PASS?T('pass'):T('fail',{p:PASS})}</p></div>
    <section><h2>${T('reviewWrong',{n:wrong.length})}</h2>${wrong.map(({q,k})=>{const r=tx(q);return `<div class="qcard"><div class="qhead"><span class="chip">${esc(srcLabel(q))}</span></div>${pic(q.img,q.t)}<div class="qtext">${esc(r.q)}</div><div class="opts">${r.o.map((o,j)=>`<div class="opt ${j===q.a?'ok':(j===ans[k]?'bad':'')}"><span class="ltr">${LET[j]}</span><span>${esc(o)}</span></div>`).join('')}</div><div class="why">${esc(r.e)}</div></div>`}).join('')}
    <div class="row"><button class="btn" id="h">${T('home')}</button></div></section>`;
    document.getElementById('h').onclick=()=>go(home);
  };
  if(!calm)timerId=setInterval(()=>{left--;const el=document.getElementById('tm');if(el)el.textContent=fmt(left);if(left<=0)finish()},1000);
  go(render);
}

/* ---------- Flashcards ---------- */
function flash(list){
  clearTimer();
  let i=0,shown=false;
  const render=()=>{
    rerender=render;const q=list[i%list.length],r=tx(q),hl=helpL();
    app.innerHTML=`<div class="qcard"><div class="qhead"><span class="chip">${esc(srcLabel(q))}</span><span>${T('card',{i:i+1})}</span></div>
    ${pic(q.img,q.t)}
    <div class="flash" id="card" role="button" tabindex="0"><div><div class="qtext">${esc(r.q)}</div>${hl?hspan(tx(q,hl).q,hl):''}${shown?`<div class="ans">${esc(r.o[q.a])}</div><p class="lead">${esc(r.e)}</p>`:`<p class="lead">${T('think')}</p>`}</div></div>
    <div class="row">${shown?`<button class="btn" id="knew">${T('knew')}</button><button class="btn ghost" id="miss">${T('missed')}</button>`:`<button class="btn" id="show">${T('reveal')}</button>`}<button class="tbtn" id="say">${IC.spk}</button><button class="btn ghost" id="h">${T('home')}</button></div></div>`;
    const reveal=()=>{shown=true;render();if(st.set.tts)speak(r.o[q.a]+'. '+r.e)};
    document.getElementById('card').onclick=()=>{if(!shown)reveal()};
    document.getElementById('say').onclick=()=>speak(shown?r.q+'. '+r.o[q.a]+'. '+r.e:r.q);
    const sh=document.getElementById('show');if(sh)sh.onclick=reveal;
    const k=document.getElementById('knew');if(k)k.onclick=()=>{mark(q,true);i++;shown=false;render()};
    const m=document.getElementById('miss');if(m)m.onclick=()=>{mark(q,false);i++;shown=false;render()};
    document.getElementById('h').onclick=()=>go(home);
    if(st.set.tts&&!shown)setTimeout(()=>speak(r.q),150);
  };
  go(render);
}

/* ---------- Learning-style settings ---------- */
function settings(back){
  rerender=()=>settings(back);
  const seg=(key,opts)=>`<div class="seg" data-key="${key}">${opts.map(([v,lab])=>`<button class="${String(st.set[key])===String(v)?'on':''}" data-v="${v}">${lab}</button>`).join('')}</div>`;
  const onoff=[[1,T('on')],[0,T('off')]];
  const voiceWarn=canSpeak&&voices.length&&!hasVoice(L)?`<p class="d" style="color:var(--bad)">${T('ttsNo')}</p>`:(!canSpeak?`<p class="d" style="color:var(--bad)">${T('ttsNo')}</p>`:'');
  app.innerHTML=`<section><h1>${T('settings')}</h1><p class="lead">${T('setL')}</p>
  <div class="set"><strong>${T('lang')}</strong><br>${seg('lang',Object.keys(LANGS).map(k=>[k,LANGS[k].n]))}</div>
  <div class="set"><strong>${T('help')}</strong><p class="d">${T('helpD')}</p>${seg('help',[['',T('none')],...Object.keys(LANGS).filter(k=>k!==L).map(k=>[k,LANGS[k].n])])}</div>
  <div class="set"><strong>${T('size')}</strong><br>${seg('size',[[1,T('s1')],[2,T('s2')],[3,T('s3')]])}</div>
  <div class="set"><strong>${T('ease')}</strong><p class="d">${T('easeD')}</p>${seg('ease',onoff)}</div>
  <div class="set"><strong>${T('tts')}</strong><p class="d">${T('ttsD')}</p>${voiceWarn}${seg('tts',onoff)} <button class="tbtn" id="test" style="margin-top:8px">${IC.spk} ${T('listen')}</button></div>
  <div class="set"><strong>${T('learn')}</strong><p class="d">${T('learnSD')}</p>${seg('learn',onoff)}</div>
  <div class="set"><strong>${T('retry')}</strong><p class="d">${T('retryD')}</p>${seg('retry',onoff)}</div>
  <div class="set"><strong>${T('len')}</strong><p class="d">${T('lenD')}</p>${seg('len',[[5,'5'],[10,'10'],[15,'15'],[20,'20']])}</div>
  <div class="set"><strong>${T('goal')}</strong><br>${seg('goal',[[10,'10'],[20,'20'],[30,'30'],[50,'50']])}</div>
  <div class="set"><strong>${T('calm')}</strong><p class="d">${T('calmD')}</p>${seg('calm',onoff)}</div>
  <div class="row"><button class="btn" id="done">${T('done')}</button></div></section>`;
  app.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const key=s.dataset.key,v=b.dataset.v;st.set[key]=key==='lang'||key==='help'?v:+v;
    if(key==='lang'){L=v;if(st.set.help===v)st.set.help=''}
    save();applyShell();settings(back);
  }));
  document.getElementById('test').onclick=()=>speak(T('heroT'));
  document.getElementById('done').onclick=()=>go(back||home);
}

document.getElementById('hdr-set').onclick=()=>{if(app.querySelector('.set'))return;const b=rerender;if(b&&b.name==='home')return go(settings);go(()=>settings(b))};
const hl0=document.getElementById('home-link');const goHome=()=>{if(inExam)return ask(T('cfQuit'),()=>go(home));go(home)};hl0.onclick=goHome;hl0.onkeydown=e=>{if(e.key==='Enter')goHome()};
if(window.Taalam){document.getElementById('hdr-acc').onclick=()=>Taalam.account();Taalam.onChange(()=>{if(rerender===home)home()})}
applyShell();home();
</script>
